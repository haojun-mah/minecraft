[project]
name = "minecraft-ai-backend"
version = "0.1.0"
description = "Generative-AI backend that turns text prompts into Minecraft block structures."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
pipeline = [
    "openai>=1.40.0",
    "google-genai>=0.3.0",
    "exa-py>=1.1.0",
    "fal-client>=0.5.0",
    "trimesh>=4.4.0",
    "numpy>=1.26.0",
    "scikit-image>=0.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "asgi-lifespan>=2.1.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline", "storage", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
